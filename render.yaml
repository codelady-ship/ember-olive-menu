# Render blueprint for the API. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: ember-olive-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        value: https://codelady-ship.github.io
      - key: RES_SLOT_CAPACITY
        value: "24"
      - key: RES_MAX_PARTY
        value: "10"
      - key: RES_DAYS_AHEAD
        value: "90"
      - key: RESTAURANT_TZ
        value: Europe/London
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "3"
